*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 'Inter Variable','PingFang SC','Hiragino Sans GB','Microsoft YaHei UI','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif}

@media(prefers-color-scheme:dark){:root{--bg:#161513;--surface:#1f1d1a;--text:#f1ede5;--muted:#bdb4a6;--border:#37332d;--accent:#7fcfc1;--hover:#a6e0d5;--on:#0e2b27}}
