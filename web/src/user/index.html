<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NonbiriAPI user console" />
    <link rel="icon" href="../shared/assets/nonbiri-mark.svg" />
    <title>NonbiriAPI</title>
  </head>
  <body>
    <noscript>
<style>
/* Minimal standalone roles from web/src/shared/styles/tokens.css. */
:root{color-scheme:light dark;--bg:#f6f4ef;--surface:#fffefb;--text:#26231e;--muted:#5c554a;--border:#e4ded3;--accent:#1d6b62;--hover:#165850;--on:#ffffff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 'Inter Variable','PingFang SC','Hiragino Sans GB','Microsoft YaHei UI','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif}
.fallback-shell{min-height:100svh;display:grid;place-items:center;padding:32px 24px}.fallback{width:min(100%,36rem);padding:40px;border:1px solid var(--border);border-radius:16px;background:var(--surface);overflow-wrap:anywhere}
.brand{display:flex;align-items:center;gap:12px;margin:0 0 32px;font-weight:700}.mark{width:40px;height:40px;flex:none;fill:var(--accent)}.mark path{fill:none;stroke:var(--on)}h1{margin:0;font-size:28px;line-height:1.25}p{margin:16px 0 0}.en{color:var(--muted)}.subtitle{margin-top:8px;font-size:20px;font-weight:600;line-height:1.6}.actions{margin-top:32px}.refresh{display:inline-flex;justify-content:center;align-items:center;gap:4px;min-height:44px;padding:8px 20px;border:1px solid transparent;border-radius:10px;background:var(--accent);color:var(--on);font-weight:600;text-align:center;text-decoration:none}.refresh:hover{background:var(--hover)}.refresh:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
@media(prefers-color-scheme:dark){:root{--bg:#161513;--surface:#1f1d1a;--text:#f1ede5;--muted:#bdb4a6;--border:#37332d;--accent:#7fcfc1;--hover:#a6e0d5;--on:#0e2b27}}
@media(width < 40rem){.fallback-shell{padding:24px 16px}.fallback{padding:24px}.refresh{width:100%}}
</style>
<div class="fallback-shell"><main class="fallback" aria-labelledby="fallback-title">
<p class="brand"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="18"/><path d="M20.5 45.5V18.5L43.5 45.5V18.5" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>NonbiriAPI</span></p>
<h1 id="fallback-title" lang="zh-CN">请启用 JavaScript</h1><p class="subtitle en" lang="en">Enable JavaScript</p>
<p lang="zh-CN">此页面需要 JavaScript。请在浏览器中启用后刷新。</p><p class="en" lang="en">This page needs JavaScript. Enable it in your browser, then refresh.</p>
<p class="actions"><a class="refresh" href=""><span lang="zh-CN">刷新重试</span> <span lang="en">/ Refresh</span></a></p>
</main></div>
</noscript>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
