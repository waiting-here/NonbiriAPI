<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NonbiriAPI user console" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='bold' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E"
    />
    <title>NonbiriAPI</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('nb.theme');
          var dark =
            theme === 'dark' ||
            (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var lang = localStorage.getItem('nb.lang');
          if (lang !== 'zh' && lang !== 'en') {
            lang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
          }
          document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        } catch (err) {
          /* best-effort bootstrap; ThemeProvider and i18n will settle state */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
