<linearGradient id="server-wall-glass" x2="0" y2="1"><stop stop-color="#effeff"/><stop offset="1" stop-color="#a6dcd9"/></linearGradient>
<pattern id="server-wall-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><ellipse cx="140" cy="117" rx="125" ry="13" fill="#42627a" stroke="none" stroke-width="3" opacity=".13"/><rect x="17" y="35" width="246" height="85" rx="13" fill="url(#server-wall-dark)" stroke="#284963" stroke-width="3" /><rect x="24" y="29" width="232" height="42" rx="10" fill="url(#server-wall-ceramic)" stroke="#284963" stroke-width="3" /><rect x="30" y="79" width="45" height="22" rx="5" fill="#376482" stroke="#163e62" stroke-width="2" /><ellipse cx="38" cy="90" rx="2.5" ry="2.5" fill="#72c9ac" stroke="none" stroke-width="3" class="ff-led"/><path d="M48 87H64M48 94H60" fill="none" stroke="#89bacd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="87" y="79" width="45" height="22" rx="5" fill="#376482" stroke="#163e62" stroke-width="2" /><ellipse cx="95" cy="90" rx="2.5" ry="2.5" fill="#72c9ac" stroke="none" stroke-width="3" class="ff-led"/><path d="M105 87H121M105 94H117" fill="none" stroke="#89bacd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="144" y="79" width="45" height="22" rx="5" fill="#376482" stroke="#163e62" stroke-width="2" /><ellipse cx="152" cy="90" rx="2.5" ry="2.5" fill="#72c9ac" stroke="none" stroke-width="3" class="ff-led"/><path d="M162 87H178M162 94H174" fill="none" stroke="#89bacd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="201" y="79" width="45" height="22" rx="5" fill="#376482" stroke="#163e62" stroke-width="2" /><ellipse cx="209" cy="90" rx="2.5" ry="2.5" fill="#72c9ac" stroke="none" stroke-width="3" class="ff-led"/><path d="M219 87H235M219 94H231" fill="none" stroke="#89bacd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="39" cy="46" rx="3" ry="3" fill="#d7e4e5" stroke="#7795a5" stroke-width="1" /><path d="M38 47L40 45" fill="none" stroke="#7795a5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="241" cy="46" rx="3" ry="3" fill="#d7e4e5" stroke="#7795a5" stroke-width="1" /><path d="M240 47L242 45" fill="none" stroke="#7795a5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></svg>