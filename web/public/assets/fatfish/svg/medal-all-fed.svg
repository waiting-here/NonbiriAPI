<pattern id="medal-all-fed-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><path d="M45 91L38 148L78 128L117 148L110 92" fill="#2b78bd" stroke="#284963" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="80" cy="74" rx="52" ry="53" fill="#72c9ac" stroke="#284963" stroke-width="3" /><ellipse cx="80" cy="74" rx="42" ry="43" fill="#fff9e9" stroke="#284963" stroke-width="2" /><g transform="translate(49 57) scale(0.9)"><path d="M6 24C5 8 30 3 43 13C47 5 54 5 59 9L55 18L65 15C65 24 58 30 46 28C39 42 11 40 6 24Z" fill="#2b78bd" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="19" cy="21" rx="2.5" ry="2.5" fill="#fffdf5" stroke="none" stroke-width="3" /><path d="M25 6Q19 -3 16 1