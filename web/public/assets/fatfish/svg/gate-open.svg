<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-asset="gate-open" viewBox="0 0 260 160" width="260" height="160" role="img"><title>补给闸 · 开启</title><defs><linearGradient id="gate-open-ceramic" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#bfdde9"/></linearGradient>
<linearGradient id="gate-open-blue" x2="0" y2="1"><stop stop-color="#78c8e0"/><stop offset="1" stop-color="#387eaf"/></linearGradient>
<linearGradient id="gate-open-dark" x2="0" y2="1"><stop stop-color="#386681"/><stop offset="1" stop-color="#163952"/></linearGradient>
<linearGradient id="gate-open-warm" x2="0" y2="1"><stop stop-color="#ffe0a1"/><stop offset="1" stop-color="#e1ac60"/></linearGradient>
<linearGradient id="gate-open-pit" x2="0" y2="1"><stop stop-color="#152d43"/><stop offset="1" stop-color="#41697b"/></linearGradient>
<linearGradient id="gate-open-glass" x2="0" y2="1"><stop stop-color="#effeff"/><stop offset="1" stop-color="#a6dcd9"/></linearGradient>
<pattern id="gate-open-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><ellipse cx="130" cy="139" rx="113" ry="10" fill="#42627a" stroke="none" stroke-width="3" opacity=".13"/><rect x="18" y="33" width="31" height="107" rx="9" fill="url(#gate-open-ceramic)" stroke="#284963" stroke-width="3" /><rect x="211" y="33" width="31" height="107" rx="9" fill="url(#gate-open-ceramic)" stroke="#284963" stroke-width="3" /><ellipse cx="33" cy="53" rx="6" ry="6" fill="#72c9ac" stroke="#284963" stroke-width="2" class="ff-led"/><ellipse cx="226" cy="53" rx="6" ry="6" fill="#72c9ac" stroke="#284963" stroke-width="2" class="ff-led"/><rect x="41" y="65" width="14" height="57" rx="5" fill="url(#gate-open-blue)" stroke="#284963" stroke-width="3" /><rect x="205" y="65" width="14" height="57" rx="5" fill="url(#gate-open-blue)" stroke="#284963" stroke-width="3" /><path d="M70 131H190" fill="none" stroke="#72c9ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 9"/></svg>