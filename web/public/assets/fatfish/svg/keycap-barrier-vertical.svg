<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-asset="keycap-barrier-vertical" viewBox="0 0 140 240" width="140" height="240" role="img"><title>竖向键帽挡板</title><defs><linearGradient id="keycap-barrier-vertical-ceramic" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#bfdde9"/></linearGradient>
<linearGradient id="keycap-barrier-vertical-blue" x2="0" y2="1"><stop stop-color="#78c8e0"/><stop offset="1" stop-color="#387eaf"/></linearGradient>
<linearGradient id="keycap-barrier-vertical-dark" x2="0" y2="1"><stop stop-color="#386681"/><stop offset="1" stop-color="#163952"/></linearGradient>
<linearGradient id="keycap-barrier-vertical-warm" x2="0" y2="1"><stop stop-color="#ffe0a1"/><stop offset="1" stop-color="#e1ac60"/></linearGradient>
<linearGradient id="keycap-barrier-vertical-pit" x2="0" y2="1"><stop stop-color="#152d43"/><stop offset="1" stop-color="#41697b"/></linearGradient>
<linearGradient id="keycap-barrier-vertical-glass" x2="0" y2="1"><stop stop-color="#effeff"/><stop offset="1" stop-color="#a6dcd9"/></linearGradient>
<pattern id="keycap-barrier-vertical-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><g transform="translate(140 0) rotate(90)"><ellipse cx="120" cy="116" rx="101" ry="13" fill="#42627a" stroke="none" stroke-width="3" opacity=".13"/><rect x="20" y="53" width="200" height="68" rx="17" fill="url(#keycap-barrier-vertical-dark)" stroke="#284963" stroke-width="3" /><path d="M20 64Q20 43 40 42H200Q220 42 220 64V91Q120 111 20 91Z" fill="url(#keycap-barrier-vertical-blue)" stroke="#284963" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="38" y="52" width="72" height="38" rx="8" fill="url(#keycap-barrier-vertical-ceramic)" stroke="#284963" stroke-width="3" /><rect x="127" y="52" width="72" height="38" rx="8" fill="url(#keycap-barrier-vertical-ceramic)" stroke="#284963" stroke-width="3" /><path d="M58 70H90M146 70H179" fill="none" stroke="#2b78bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="109" y="55" width="13" height="34" rx="6" fill="url(#keycap-barrier-vertical-warm)" stroke="#284963" stroke-width="3" /><path d="M36 103H204" fill="none" stroke="#6daecb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></svg>