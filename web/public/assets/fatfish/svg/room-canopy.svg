<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-asset="room-canopy" viewBox="0 0 960 100" width="960" height="100" role="img"><title>补给站顶饰</title><defs><linearGradient id="room-canopy-ceramic" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#bfdde9"/></linearGradient>
<linearGradient id="room-canopy-blue" x2="0" y2="1"><stop stop-color="#78c8e0"/><stop offset="1" stop-color="#387eaf"/></linearGradient>
<linearGradient id="room-canopy-dark" x2="0" y2="1"><stop stop-color="#386681"/><stop offset="1" stop-color="#163952"/></linearGradient>
<linearGradient id="room-canopy-warm" x2="0" y2="1"><stop stop-color="#ffe0a1"/><stop offset="1" stop-color="#e1ac60"/></linearGradient>
<linearGradient id="room-canopy-pit" x2="0" y2="1"><stop stop-color="#152d43"/><stop offset="1" stop-color="#41697b"/></linearGradient>
<linearGradient id="room-canopy-glass" x2="0" y2="1"><stop stop-color="#effeff"/><stop offset="1" stop-color="#a6dcd9"/></linearGradient>
<pattern id="room-canopy-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><rect x="0" y="0" width="960" height="100" rx="0" fill="#234964" stroke="#284963" stroke-width="0" /><rect x="42" y="20" width="876" height="12" rx="6" fill="#406983" stroke="#284963" stroke-width="0" /><rect x="138" y="45" width="209" height="9" rx="4" fill="#fff0c8" stroke="#284963" stroke-width="0" /><rect x="610" y="45" width="209" height="9" rx="4" fill="#fff0c8" stroke="#284963" stroke-width="0" /><path d="M60 80H900" fill="none" stroke="#548299" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>