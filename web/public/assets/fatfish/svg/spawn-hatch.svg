<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-asset="spawn-hatch" viewBox="0 0 160 160" width="160" height="160" role="img"><title>小鱼上线舱</title><defs><linearGradient id="spawn-hatch-ceramic" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#bfdde9"/></linearGradient>
<linearGradient id="spawn-hatch-blue" x2="0" y2="1"><stop stop-color="#78c8e0"/><stop offset="1" stop-color="#387eaf"/></linearGradient>
<linearGradient id="spawn-hatch-dark" x2="0" y2="1"><stop stop-color="#386681"/><stop offset="1" stop-color="#163952"/></linearGradient>
<linearGradient id="spawn-hatch-warm" x2="0" y2="1"><stop stop-color="#ffe0a1"/><stop offset="1" stop-color="#e1ac60"/></linearGradient>
<linearGradient id="spawn-hatch-pit" x2="0" y2="1"><stop stop-color="#152d43"/><stop offset="1" stop-color="#41697b"/></linearGradient>
<linearGradient id="spawn-hatch-glass" x2="0" y2="1"><stop stop-color="#effeff"/><stop offset="1" stop-color="#a6dcd9"/></linearGradient>
<pattern id="spawn-hatch-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><ellipse cx="80" cy="139" rx="57" ry="10" fill="#42627a" stroke="none" stroke-width="3" opacity=".13"/><rect x="26" y="37" width="109" height="106" rx="23" fill="url(#spawn-hatch-ceramic)" stroke="#284963" stroke-width="3" /><path d="M35 55Q39 25 79 25Q120 26 126 55Z" fill="url(#spawn-hatch-blue)" stroke="#284963" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="62" width="77" height="72" rx="16" fill="url(#spawn-hatch-dark)" stroke="#284963" stroke-width="3" /><rect x="52" y="74" width="57" height="63" rx="12" fill="#b4ece8" stroke="#284963" stroke-width="0" /><path d="M52 114H109" fill="none" stroke="#effff7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="45" y="127" width="73" height="15" rx="5" fill="url(#spawn-hatch-blue)" stroke="#284963" stroke-width="3" /><g transform="translate(62 33) scale(0.47)"><path d="M6 24C5 8 30 3 43 13C47 5 54 5 59 9L55 18L65 15C65 24 58 30 46 28C39 42 11 40 6 24Z" fill="#2b78bd" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="19" cy="21" rx="2.5" ry="2.5" fill="#fffdf5" stroke="none" stroke-width="3" /><path d="M25 6Q19 -3 16 1M25 6Q31 -4 34 1" fill="none" stroke="#2b78bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><ellipse cx="122" cy="82" rx="4" ry="4" fill="#72c9ac" stroke="#284963" stroke-width="1" class="ff-led"/></svg>