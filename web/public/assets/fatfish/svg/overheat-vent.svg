<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-asset="overheat-vent" viewBox="0 0 160 160" width="160" height="160" role="img"><title>过热散热口</title><defs><linearGradient id="overheat-vent-ceramic" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#bfdde9"/></linearGradient>
<linearGradient id="overheat-vent-blue" x2="0" y2="1"><stop stop-color="#78c8e0"/><stop offset="1" stop-color="#387eaf"/></linearGradient>
<linearGradient id="overheat-vent-dark" x2="0" y2="1"><stop stop-color="#386681"/><stop offset="1" stop-color="#163952"/></linearGradient>
<linearGradient id="overheat-vent-warm" x2="0" y2="1"><stop stop-color="#ffe0a1"/><stop offset="1" stop-color="#e1ac60"/></linearGradient>
<linearGradient id="overheat-vent-pit" x2="0" y2="1"><stop stop-color="#152d43"/><stop offset="1" stop-color="#41697b"/></linearGradient>
<linearGradient id="overheat-vent-glass" x2="0" y2="1"><stop stop-color="#effeff"/><stop offset="1" stop-color="#a6dcd9"/></linearGradient>
<pattern id="overheat-vent-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><ellipse cx="80" cy="139" rx="57" ry="10" fill="#42627a" stroke="none" stroke-width="3" opacity=".13"/><rect x="21" y="50" width="118" height="89" rx="17" fill="url(#overheat-vent-dark)" stroke="#284963" stroke-width="3" /><rect x="24" y="44" width="112" height="76" rx="15" fill="#e8b38b" stroke="#284963" stroke-width="3" /><rect x="37" y="57" width="86" height="52" rx="10" fill="#713d3e" stroke="#284963" stroke-width="3" /><path d="M48 65V101" fill="none" stroke="#f29a78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="ff-led"/><path d="M63 65V101" fill="none" stroke="#f29a78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="ff-led"/><path d="M78 65V101" fill="none" stroke="#f29a78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="ff-led"/><path d="M93 65V101" fill="none" stroke="#f29a78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="ff-led"/><path d="M108 65V101" fill="none" stroke="#f29a78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="ff-led"/><path d="M58 41Q49 31 58 21" fill="none" stroke="#e98575" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="ff-steam"/><path d="M81 41Q72 31 81 21" fill="none" stroke="#e98575" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="ff-steam"/><path d="M104 41Q95 31 104 21" fill="none" stroke="#e98575" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="ff-steam"/><path d="M41 126H59M102 126H120" fill="none" stroke="#e98575" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></svg>