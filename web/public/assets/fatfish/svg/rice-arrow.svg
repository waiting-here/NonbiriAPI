<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-asset="rice-arrow" viewBox="0 0 160 160" width="160" height="160" role="img"><title>开饭箭头</title><defs><linearGradient id="rice-arrow-ceramic" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#bfdde9"/></linearGradient>
<linearGradient id="rice-arrow-blue" x2="0" y2="1"><stop stop-color="#78c8e0"/><stop offset="1" stop-color="#387eaf"/></linearGradient>
<linearGradient id="rice-arrow-dark" x2="0" y2="1"><stop stop-color="#386681"/><stop offset="1" stop-color="#163952"/></linearGradient>
<linearGradient id="rice-arrow-warm" x2="0" y2="1"><stop stop-color="#ffe0a1"/><stop offset="1" stop-color="#e1ac60"/></linearGradient>
<linearGradient id="rice-arrow-pit" x2="0" y2="1"><stop stop-color="#152d43"/><stop offset="1" stop-color="#41697b"/></linearGradient>
<linearGradient id="rice-arrow-glass" x2="0" y2="1"><stop stop-color="#effeff"/><stop offset="1" stop-color="#a6dcd9"/></linearGradient>
<pattern id="rice-arrow-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><ellipse cx="80" cy="120" rx="59" ry="13" fill="#42627a" stroke="none" stroke-width="3" opacity=".13"/><path d="M25 80L75 52Q81 48 88 52L139 80V106L84 137L25 104Z" fill="url(#rice-arrow-dark)" stroke="#284963" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M25 80L76 50Q82 47 88 50L139 79L84 111Z" fill="#95d7be" stroke="#284963" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(52 58) scale(1.05)"><path d="M0 11H24V0L45 20L24 40V29H0Z" fill="#fffdf5" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g></svg>