<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-asset="floor-edge" viewBox="0 0 320 52" width="320" height="52" role="img"><title>安全边框</title><defs><linearGradient id="floor-edge-ceramic" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#bfdde9"/></linearGradient>
<linearGradient id="floor-edge-blue" x2="0" y2="1"><stop stop-color="#78c8e0"/><stop offset="1" stop-color="#387eaf"/></linearGradient>
<linearGradient id="floor-edge-dark" x2="0" y2="1"><stop stop-color="#386681"/><stop offset="1" stop-color="#163952"/></linearGradient>
<linearGradient id="floor-edge-warm" x2="0" y2="1"><stop stop-color="#ffe0a1"/><stop offset="1" stop-color="#e1ac60"/></linearGradient>
<linearGradient id="floor-edge-pit" x2="0" y2="1"><stop stop-color="#152d43"/><stop offset="1" stop-color="#41697b"/></linearGradient>
<linearGradient id="floor-edge-glass" x2="0" y2="1"><stop stop-color="#effeff"/><stop offset="1" stop-color="#a6dcd9"/></linearGradient>
<pattern id="floor-edge-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><rect x="2" y="2" width="316" height="46" rx="16" fill="url(#floor-edge-ceramic)" stroke="#284963" stroke-width="3" /><path d="M23 16H295" fill="none" stroke="#fffef9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="16" cy="27" rx="3" ry="3" fill="#d7e4e5" stroke="#7795a5" stroke-width="1" /><path d="M15 28L17 26" fill="none" stroke="#7795a5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="304" cy="27" rx="3" ry="3" fill="#d7e4e5" stroke="#7795a5" stroke-width="1" /><path d="M303 28L305 26" fill="none" stroke="#7795a5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></svg>