<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-asset="rice-sparkles" viewBox="0 0 160 160" width="160" height="160" role="img"><title>米粒庆祝</title><defs><linearGradient id="rice-sparkles-ceramic" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#bfdde9"/></linearGradient>
<linearGradient id="rice-sparkles-blue" x2="0" y2="1"><stop stop-color="#78c8e0"/><stop offset="1" stop-color="#387eaf"/></linearGradient>
<linearGradient id="rice-sparkles-dark" x2="0" y2="1"><stop stop-color="#386681"/><stop offset="1" stop-color="#163952"/></linearGradient>
<linearGradient id="rice-sparkles-warm" x2="0" y2="1"><stop stop-color="#ffe0a1"/><stop offset="1" stop-color="#e1ac60"/></linearGradient>
<linearGradient id="rice-sparkles-pit" x2="0" y2="1"><stop stop-color="#152d43"/><stop offset="1" stop-color="#41697b"/></linearGradient>
<linearGradient id="rice-sparkles-glass" x2="0" y2="1"><stop stop-color="#effeff"/><stop offset="1" stop-color="#a6dcd9"/></linearGradient>
<pattern id="rice-sparkles-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><g transform="rotate(-30 38 42)"><ellipse cx="38" cy="42" rx="3" ry="7" fill="#fff9df" stroke="#b8ced3" stroke-width="0.75" /></g><g transform="rotate(35 121 34)"><ellipse cx="121" cy="34" rx="3" ry="7" fill="#fff9df" stroke="#b8ced3" stroke-width="0.75" /></g><g transform="rotate(45 26 99)"><ellipse cx="26" cy="99" rx="3" ry="7" fill="#fff9df" stroke="#b8ced3" stroke-width="0.75" /></g><g transform="rotate(-40 130 115)"><ellipse cx="130" cy="115" rx="3" ry="7" fill="#fff9df" stroke="#b8ced3" stroke-width="0.75" /></g><g transform="rotate(80 83 24)"><ellipse cx="83" cy="24" rx="3" ry="7" fill="#fff9df" stroke="#b8ced3" stroke-width="0.75" /></g><path d="M73 52V68M65 60H81" fill="none" stroke="#efbc66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="ff-spark"/><path d="M110 76V92M102 84H118" fill="none" stroke="#efbc66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="ff-spark"/><path d="M57 113V129M49 121H65" fill="none" stroke="#efbc66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="ff-spark"/></svg>