<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-asset="icon-settings" viewBox="0 0 36 36" width="36" height="36" role="img"><title>设置</title><defs><linearGradient id="icon-settings-ceramic" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#bfdde9"/></linearGradient>
<linearGradient id="icon-settings-blue" x2="0" y2="1"><stop stop-color="#78c8e0"/><stop offset="1" stop-color="#387eaf"/></linearGradient>
<linearGradient id="icon-settings-dark" x2="0" y2="1"><stop stop-color="#386681"/><stop offset="1" stop-color="#163952"/></linearGradient>
<linearGradient id="icon-settings-warm" x2="0" y2="1"><stop stop-color="#ffe0a1"/><stop offset="1" stop-color="#e1ac60"/></linearGradient>
<linearGradient id="icon-settings-pit" x2="0" y2="1"><stop stop-color="#152d43"/><stop offset="1" stop-color="#41697b"/></linearGradient>
<linearGradient id="icon-settings-glass" x2="0" y2="1"><stop stop-color="#effeff"/><stop offset="1" stop-color="#a6dcd9"/></linearGradient>
<pattern id="icon-settings-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><ellipse cx="18" cy="18" rx="6" ry="6" fill="none" stroke="#284963" stroke-width="3" /><path d="M29.00 18.00L33.00 18.00" fill="none" stroke="#284963" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M25.78 25.78L28.61 28.61" fill="none" stroke="#284963" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M18.00 29.00L18.00 33.00" fill="none" stroke="#284963" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M10.22 25.78L7.39 28.61" fill="none" stroke="#284963" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M7.00 18.00L3.00 18.00" fill="none" stroke="#284963" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M10.22 10.22L7.39 7.39" fill="none" stroke="#284963" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M18.00 7.00L18.00 3.00" fill="none" stroke="#284963" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M25.78 10.22L28.61 7.39" fill="none" stroke="#284963" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg>