<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-asset="cooling-fan" viewBox="0 0 160 160" width="160" height="160" role="img"><title>加班小风扇</title><defs><linearGradient id="cooling-fan-ceramic" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#bfdde9"/></linearGradient>
<linearGradient id="cooling-fan-blue" x2="0" y2="1"><stop stop-color="#78c8e0"/><stop offset="1" stop-color="#387eaf"/></linearGradient>
<linearGradient id="cooling-fan-dark" x2="0" y2="1"><stop stop-color="#386681"/><stop offset="1" stop-color="#163952"/></linearGradient>
<linearGradient id="cooling-fan-warm" x2="0" y2="1"><stop stop-color="#ffe0a1"/><stop offset="1" stop-color="#e1ac60"/></linearGradient>
<linearGradient id="cooling-fan-pit" x2="0" y2="1"><stop stop-color="#152d43"/><stop offset="1" stop-color="#41697b"/></linearGradient>
<linearGradient id="cooling-fan-glass" x2="0" y2="1"><stop stop-color="#effeff"/><stop offset="1" stop-color="#a6dcd9"/></linearGradient>
<pattern id="cooling-fan-floorgrid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cbdde1" stroke-width="1.5"/><circle cx="4" cy="4" r="1.4" fill="#bdd2da"/></pattern></defs><style>.ff-steam{animation:ff-steam 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-steam.b{animation-delay:-.85s}.ff-steam.c{animation-delay:-1.7s}.ff-led{animation:ff-glow 2.2s ease-in-out infinite}.ff-float{animation:ff-float 2.8s ease-in-out infinite}.ff-spin{animation:ff-spin 4s linear infinite;transform-box:fill-box;transform-origin:center}.ff-spark{animation:ff-glow 1.8s ease-in-out infinite}.ff-wave{animation:ff-wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ff-paused *{animation-play-state:paused!important}@keyframes ff-steam{0%,100%{opacity:.35;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-5px)}}@keyframes ff-glow{0%,100%{opacity:.55}50%{opacity:1}}@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes ff-spin{to{transform:rotate(360deg)}}@keyframes ff-wave{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.ff-steam,.ff-led,.ff-float,.ff-spin,.ff-spark,.ff-wave{animation:none!important}}</style><ellipse cx="80" cy="139" rx="57" ry="10" fill="#42627a" stroke="none" stroke-width="3" opacity=".13"/><rect x="64" y="105" width="32" height="28" rx="7" fill="url(#cooling-fan-ceramic)" stroke="#284963" stroke-width="3" /><rect x="43" y="130" width="74" height="13" rx="6" fill="url(#cooling-fan-blue)" stroke="#284963" stroke-width="3" /><ellipse cx="80" cy="74" rx="50" ry="49" fill="url(#cooling-fan-ceramic)" stroke="#284963" stroke-width="3" /><ellipse cx="80" cy="74" rx="39" ry="38" fill="#c6e3e7" stroke="#284963" stroke-width="2" /><g class="ff-spin"><g transform="rotate(0 80 74)"><path d="M80 75C60 63 62 39 78 42Q98 44 87 68Z" fill="#619fb9" stroke="#284963" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="rotate(120 80 74)"><path d="M80 75C60 63 62 39 78 42Q98 44 87 68Z" fill="#619fb9" stroke="#284963" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="rotate(240 80 74)"><path d="M80 75C60 63 62 39 78 42Q98 44 87 68Z" fill="#619fb9" stroke="#284963" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><ellipse cx="80" cy="74" rx="8" ry="8" fill="#f6f6e8" stroke="#284963" stroke-width="2" /></svg>