name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go_build:
    name: Go build, vet, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build, vet, and test
        run: bash scripts/check-go.sh

  race:
    name: Race tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run complete race shard
        run: bash scripts/race-check.sh --shard "${{ matrix.shard }}"

  go:
    name: Go checks
    if: ${{ always() }}
    needs: [go_build, race]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Go checks
        env:
          GO_BUILD_RESULT: ${{ needs.go_build.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$GO_BUILD_RESULT" = success
          test "$RACE_RESULT" = success

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pin npm
        run: |
          npm install --global npm@12.0.1
          test "$(npm --version)" = "12.0.1"
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build both stations
        run: npm run build
      - name: Verify generated notices
        run: git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Browser smoke
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e
