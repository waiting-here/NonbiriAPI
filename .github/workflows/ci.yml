name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification scope
        type: choice
        options: [full, routine]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Verification scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      go: ${{ steps.scope.outputs.go }}
      race: ${{ steps.scope.outputs.race }}
      web: ${{ steps.scope.outputs.web }}
      upgrade: ${{ steps.scope.outputs.upgrade }}
      go_packages: ${{ steps.scope.outputs.go_packages }}
      race_packages: ${{ steps.scope.outputs.race_packages }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Select live verification scope
        id: scope
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'routine' }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go run ./internal/citools/riskplan -mode "$MODE" -base "$BASE" -head "$HEAD" \
            -github-output "$GITHUB_OUTPUT" | tee verification-plan.json
          printf 'Source: %s\nTree: %s\n' "$HEAD" "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_STEP_SUMMARY"
          go version >> "$GITHUB_STEP_SUMMARY"
          printf '\nVerification plan:\n' >> "$GITHUB_STEP_SUMMARY"
          cat verification-plan.json >> "$GITHUB_STEP_SUMMARY"

  go_build:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    name: Go build, vet, and test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Verify required result semantics
        run: bash scripts/check-ci-results.test.sh
      - name: Build, vet, and test
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          GO_PACKAGES: ${{ needs.plan.outputs.go_packages }}
        run: |
          set -euo pipefail
          if [ "$MODE" = full ]; then
            bash scripts/check-go.sh
          else
            read -r -a packages <<< "$GO_PACKAGES"
            test "${#packages[@]}" -gt 0
            go build "${packages[@]}"
            go vet "${packages[@]}"
            go test -timeout=30m "${packages[@]}"
          fi
      - name: Upgrade populated released databases
        if: needs.plan.outputs.upgrade == 'true'
        run: bash scripts/check-upgrade.sh

  race:
    needs: plan
    if: needs.plan.outputs.race == 'true'
    name: Race tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ["1/16", "2/16", "3/16", "4/16", "5/16", "6/16", "7/16", "8/16", "9/16", "10/16", "11/16", "12/16", "13/16", "14/16", "15/16", "16/16"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Run complete race shard
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          RACE_PACKAGES: ${{ needs.plan.outputs.race_packages }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ "$MODE" = full ]; then
            bash scripts/race-check.sh --shard "$SHARD" --workers 4
          else
            bash scripts/race-check.sh --shard "$SHARD" --workers 4 --packages "$RACE_PACKAGES"
          fi

  go:
    name: Go checks
    if: ${{ always() }}
    needs: [plan, go_build, race]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all Go checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          FIRST_APPLICABLE: ${{ needs.plan.outputs.go }}
          SECOND_APPLICABLE: ${{ needs.plan.outputs.race }}
          FIRST_RESULT: ${{ needs.go_build.result }}
          SECOND_RESULT: ${{ needs.race.result }}
        run: |
          set -euo pipefail
          bash scripts/check-ci-results.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Confirm full Go coverage
        if: needs.plan.outputs.mode == 'full'
        env:
          UPGRADE_APPLICABLE: ${{ needs.plan.outputs.upgrade }}
        run: |
          test "$UPGRADE_APPLICABLE" = true
          printf 'Complete Go, race, and populated upgrade coverage passed.\n' >> "$GITHUB_STEP_SUMMARY"

  web_unit:
    outputs:
      artifact_id: ${{ steps.station_build.outputs.artifact-id }}
    needs: plan
    if: needs.plan.outputs.web == 'true'
    name: Web unit, types, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pin npm
        run: |
          npm install --global npm@12.0.1
          test "$(npm --version)" = "12.0.1"
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build both stations
        run: npm run build
      - name: Verify generated notices
        run: git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Share verified station build
        id: station_build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: station-build-${{ github.sha }}-${{ github.run_attempt }}
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  web_browser:
    needs: [plan, web_unit]
    if: needs.plan.outputs.web == 'true'
    name: Web browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, integration]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Go for browser integration
        if: matrix.suite == 'integration'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Pin npm
        run: |
          npm install --global npm@12.0.1
          test "$(npm --version)" = "12.0.1"
      - name: Install dependencies
        run: npm ci
      - name: Require the verified station artifact
        env:
          ARTIFACT_ID: ${{ needs.web_unit.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"
      - name: Download verified station build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.web_unit.outputs.artifact_id }}
          path: web/dist
      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Deterministic game engine in Chromium
        if: matrix.suite == 'smoke'
        run: node test/fatfish-engine/check.mjs chromium
      - name: Browser smoke
        if: matrix.suite == 'smoke'
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e
      - name: Image activity browser integration
        if: matrix.suite == 'integration'
        env:
          PLAYWRIGHT_HTML_OPEN: never
          CGO_ENABLED: "0"
        run: npx playwright test -c playwright.picturebook.config.ts
      - name: Audit browser integration
        if: matrix.suite == 'integration'
        env:
          PLAYWRIGHT_HTML_OPEN: never
          CGO_ENABLED: "0"
        run: npx playwright test -c playwright.audit.config.ts
      - name: Fish game browser integration
        if: matrix.suite == 'integration'
        env:
          PLAYWRIGHT_HTML_OPEN: never
          CGO_ENABLED: "0"
        run: npx playwright test -c playwright.fatfish.config.ts

  web:
    name: Web checks
    if: ${{ always() }}
    needs: [plan, web_unit, web_browser]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all Web checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          FIRST_APPLICABLE: ${{ needs.plan.outputs.web }}
          SECOND_APPLICABLE: ${{ needs.plan.outputs.web }}
          FIRST_RESULT: ${{ needs.web_unit.result }}
          SECOND_RESULT: ${{ needs.web_browser.result }}
        run: |
          set -euo pipefail
          bash scripts/check-ci-results.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Confirm full Web coverage
        if: needs.plan.outputs.mode == 'full'
        run: printf 'Complete Web and browser coverage passed.\n' >> "$GITHUB_STEP_SUMMARY"
