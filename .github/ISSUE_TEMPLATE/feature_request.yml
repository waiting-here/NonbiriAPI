name: Feature request
description: Suggest a change or improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security, privacy, compatibility, and operational impact
      description: Mention ownership, credentials, data lifecycle, API compatibility, migrations, and rollback considerations.
    validations:
      required: true
